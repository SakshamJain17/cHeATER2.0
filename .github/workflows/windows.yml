name: Windows tests

on:
  push:
    branches: [windows]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Check hidden launcher error path
        shell: pwsh
        run: |
          Remove-Item codekey.log -ErrorAction SilentlyContinue
          $output = & cscript.exe //nologo launch_windows.vbs 2>&1
          if ($output) { throw "Hidden launcher wrote to the console: $output" }
          if ($LASTEXITCODE -ne 1) { throw "Expected missing-setup exit code 1, got $LASTEXITCODE" }
          if (-not (Select-String -Path codekey.log -Pattern 'CodeKey setup is missing' -Quiet)) {
            throw 'Hidden launcher did not record the missing setup error.'
          }
